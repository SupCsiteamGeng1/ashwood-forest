<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>Ashwood 2.5D</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Noto+Sans+Thai:wght@400;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#070a08;color:#f1e6c8;font-family:'Noto Sans Thai',sans-serif;user-select:none;touch-action:manipulation;-webkit-user-select:none;-webkit-touch-callout:none}
canvas{display:block;width:100%;height:100%;touch-action:none}
#joy{position:fixed;left:18px;bottom:92px;width:120px;height:120px;border-radius:50%;background:rgba(20,22,16,.45);border:2px solid rgba(212,175,55,.35);z-index:8}
#joyKnob{position:absolute;left:40px;top:40px;width:40px;height:40px;border-radius:50%;background:rgba(240,193,74,.85);border:2px solid #f0c14a}
#atkBtn{position:fixed;right:22px;bottom:96px;width:78px;height:78px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:Cinzel,serif;font-size:13px;color:#f0c14a;z-index:8;cursor:pointer}
.glass{background:linear-gradient(180deg,rgba(18,22,16,.92),rgba(10,12,9,.88));border:1px solid rgba(212,175,55,.35);box-shadow:0 10px 30px rgba(0,0,0,.45);border-radius:16px}
#panel{position:fixed;left:16px;top:16px;width:280px;padding:14px 16px}
.name{font-family:Cinzel,serif;font-size:18px}
.lv{color:#f0c14a;font-family:Cinzel,serif}
.barwrap{margin:8px 0 2px;font-size:11px;display:flex;justify-content:space-between}
.bar{height:11px;background:#14140f;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px}
#hpFill{background:linear-gradient(90deg,#7a1e18,#e14b3a)}
#mpFill{background:linear-gradient(90deg,#1d3f7a,#4d8fe8)}
#expFill{background:linear-gradient(90deg,#8a6a12,#f0c14a);width:0}
.stats{margin-top:10px;font-size:12px;display:flex;flex-wrap:wrap;gap:6px}
.chip{background:#1b1a14;border:1px solid #3d3420;border-radius:999px;padding:3px 8px}
#hint{position:fixed;top:16px;left:50%;transform:translateX(-50%);font-size:12px;color:#d7c58a;background:rgba(0,0,0,.35);padding:6px 12px;border-radius:999px}
#skills{position:fixed;left:16px;bottom:16px;display:flex;gap:10px}
.sk{width:58px;height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;cursor:pointer}
.sk b{font-family:Cinzel,serif;color:#f0c14a;font-size:15px}
#chatBtn{position:fixed;right:16px;bottom:16px;z-index:9;min-width:64px;height:42px;padding:0 12px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer}
#log{position:fixed;right:16px;bottom:64px;width:280px;max-height:130px;overflow:auto;padding:10px 12px;font-size:12px;display:none}
#log.open{display:block}
#log .gold{color:#f0c14a}#log .dmg{color:#ff7a6a}#log .sys{color:#c9b27a}
#statModal,#deadModal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55)}
#statModal.show,#deadModal.show{display:flex}
.modal{width:400px;padding:22px}
.modal h2{font-family:Cinzel,serif;color:#f0c14a;margin-bottom:10px}
.row{display:grid;grid-template-columns:64px 1fr 40px 36px;gap:8px;margin:9px 0;align-items:center}
.row button,.btn{background:#2b2414;color:#f0c14a;border:1px solid #6a5420;border-radius:8px;height:30px;cursor:pointer}
.btn{margin-top:14px;padding:9px 16px;height:auto}
@media (max-width:900px){
  #panel{left:8px;top:8px;width:min(58vw,210px);padding:7px 9px;border-radius:12px}
  #panel .stats,#hint{display:none}
  #panel .name{font-size:13px}
  .barwrap{margin:3px 0 1px;font-size:10px}
  .bar{height:7px}
  #skills{left:auto;right:8px;bottom:10px;flex-wrap:wrap;width:112px;justify-content:flex-end;gap:6px}
  .sk{width:52px;height:48px;font-size:9px;border-radius:10px}
  .sk b{font-size:12px}
  #joy{left:10px;bottom:14px;width:96px;height:96px}
  #joyKnob{left:32px;top:32px;width:32px;height:32px}
  #atkBtn{right:128px;bottom:14px;width:56px;height:56px;font-size:11px}
  #chatBtn{right:8px;bottom:auto;top:8px;height:32px;min-width:52px}
  #log{right:8px;top:44px;bottom:auto;width:min(64vw,230px);max-height:24vh}
  .modal{width:min(92vw,400px)}
}
@media (min-width:901px){
  #joy,#atkBtn{display:none}
  #log{display:block}
}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="joy"><div id="joyKnob"></div></div>
<div id="atkBtn" class="glass">ATK</div>
<div id="panel" class="glass">
<div style="display:flex;justify-content:space-between"><span class="name">นักล่าปีศาจ</span><span class="lv">Lv. <b id="lvl">1</b></span></div>
<div class="barwrap"><span>HP</span><span id="hpTxt"></span></div><div class="bar"><i id="hpFill"></i></div>
<div class="barwrap"><span>MP</span><span id="mpTxt"></span></div><div class="bar"><i id="mpFill"></i></div>
<div class="barwrap"><span>EXP</span><span id="expTxt"></span></div><div class="bar"><i id="expFill"></i></div>
<div class="stats"><span class="chip">STR <b id="sStr">8</b></span><span class="chip">VIT <b id="sVit">8</b></span><span class="chip">AGI <b id="sAgi">8</b></span><span class="chip">INT <b id="sInt">6</b></span><span class="chip">LUK <b id="sLuk">5</b></span><span class="chip" id="ptsLabel" style="display:none;color:#f0c14a"></span></div>
</div>
<div id="hint">WASD เดิน · คลิก / 1 โจมตี · 2 หมุนดาบ · 3 พุ่ง · C สถานะ · F5 เซฟ</div>
<div id="skills">
<div class="sk glass" data-sk="1"><b>1</b>ฟาด</div>
<div class="sk glass" data-sk="2"><b>2</b>หมุน</div>
<div class="sk glass" data-sk="3"><b>3</b>พุ่ง</div>
<div class="sk glass" id="btnC"><b>C</b>สถานะ</div>
<div class="sk glass" id="btnSave"><b>F5</b>เซฟ</div>
</div>
<div id="chatBtn" class="glass">แชท</div>
<div id="log" class="glass"></div>
<div id="statModal"><div class="modal glass"><h2>CHARACTER</h2><div>แต้มคงเหลือ <b id="pts">0</b></div>
<div class="row"><span>STR</span><span>พลังโจมตี</span><b id="mStr">8</b><button data-st="str">+</button></div>
<div class="row"><span>VIT</span><span>พลังชีวิต</span><b id="mVit">8</b><button data-st="vit">+</button></div>
<div class="row"><span>AGI</span><span>ความเร็ว</span><b id="mAgi">8</b><button data-st="agi">+</button></div>
<div class="row"><span>INT</span><span>มานา</span><b id="mInt">6</b><button data-st="int">+</button></div>
<div class="row"><span>LUK</span><span>คริติคอล</span><b id="mLuk">5</b><button data-st="luk">+</button></div>
<button class="btn" id="closeStat">ปิด</button></div></div>
<div id="deadModal"><div class="modal glass" style="text-align:center"><h2>YOU DIED</h2><button class="btn" id="revive">ฟื้นที่กองไฟ</button></div></div>

const stick={mx:0,my:0,active:false};
const joy=document.getElementById('joy'),knob=document.getElementById('joyKnob');
function setStick(x,y){const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=x-cx,dy=y-cy;const max=r.width*0.32,l=Math.hypot(dx,dy)||1;if(l>max){dx=dx/l*max;dy=dy/l*max;}knob.style.left=(r.width/2-20+dx)+'px';knob.style.top=(r.height/2-20+dy)+'px';stick.mx=dx/max;stick.my=dy/max;}
function endStick(){stick.active=false;stick.mx=0;stick.my=0;const r=joy.getBoundingClientRect(),k=knob.getBoundingClientRect();knob.style.left=((r.width-k.width)/2)+'px';knob.style.top=((r.height-k.height)/2)+'px';}
joy.addEventListener('pointerdown',e=>{e.preventDefault();joy.setPointerCapture(e.pointerId);stick.active=true;setStick(e.clientX,e.clientY);});
joy.addEventListener('pointermove',e=>{if(stick.active)setStick(e.clientX,e.clientY);});
joy.addEventListener('pointerup',endStick);joy.addEventListener('pointercancel',endStick);

addEventListener('mousedown',e=>{if(e.button===0 && e.target===cv)swing();});
document.body.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());
let lastTap=0;
document.addEventListener('touchend',e=>{const n=Date.now();if(n-lastTap<350)e.preventDefault();lastTap=n;},{passive:false});
const skills={1:{cd:0,max:.32,mp:0},2:{cd:0,max:4,mp:12},3:{cd:0,max:5.2,mp:16}};
function atk(){const crit=Math.random()<(0.05+hero.luk*0.008);return {d:Math.round((10+hero.str*2.2+hero.lvl)*(crit?1.8:1)*(0.9+Math.random()*0.22)),crit};}
function nearest(range){let best=null,bd=range;for(const en of enemies){if(!en.alive)continue;const d=Math.hypot(en.x-hero.x,en.y-hero.y);if(d<bd){bd=d;best=en;}}return best;}
function deal(en,dmg,crit){en.hp-=dmg;log((crit?'คริ ':'')+dmg+' → '+en.name,crit?'gold':'dmg');if(en.hp<=0){en.alive=false;hero.exp+=en.exp;log('ล่า '+en.name+' +'+en.exp+' EXP','gold');while(hero.exp>=hero.next)levelUp();setTimeout(()=>{en.alive=true;en.hp=en.maxHp;},15000);}}
function swing(){if(hero.dead||hero.atkCd>0)return;hero.atkCd=Math.max(.26,.48-hero.agi*0.01);hero.swing=0.22;act={name:'atk1',t:0,dur:0.42,flip:facingLeft()};const a=atk(),en=nearest(2.15);if(en)deal(en,a.d,a.crit);}
function whirl(){const a=atk();for(const en of enemies){if(!en.alive)continue;if(Math.hypot(en.x-hero.x,en.y-hero.y)<3.3)deal(en,Math.round(a.d*1.28),a.crit);}hero.swing=0.28;act={name:'atk2',t:0,dur:0.5,flip:facingLeft()};}
function dash(){hero.x+=Math.cos(hero.dir)*2.3;hero.y+=Math.sin(hero.dir)*2.3;act={name:'skill',t:0,dur:0.46,flip:facingLeft()};const a=atk(),en=nearest(2.6);if(en)deal(en,Math.round(a.d*1.5),a.crit);}
function cast(id){if(hero.dead)return;const s=skills[id];if(!s||s.cd>0)return;if(hero.mp<s.mp){log('มานาไม่พอ','sys');return;}hero.mp-=s.mp;s.cd=s.max;if(id===1)swing();if(id===2)whirl();if(id===3)dash();}
function levelUp(){hero.exp-=hero.next;hero.lvl++;hero.next=Math.round(70*Math.pow(1.22,hero.lvl-1));hero.pts+=5;recalc();hero.hp=hero.maxHp;hero.mp=hero.maxMp;log('LEVEL UP '+hero.lvl,'gold');document.getElementById('statModal').classList.add('show');refreshStats();}
function saveGame(m){try{localStorage.setItem('ashwood-25d-v2',JSON.stringify(hero));if(m)log('เซฟแล้ว','gold');}catch(e){}}
function loadGame(m){try{const raw=localStorage.getItem('ashwood-25d-v2');if(!raw){if(m)log('ยังไม่มีเซฟ','sys');return;}Object.assign(hero,JSON.parse(raw));recalc();hero.dead=false;if(m)log('โหลด Lv.'+hero.lvl,'gold');}catch(e){}}
loadGame(false);setInterval(()=>{if(!hero.dead)saveGame(false);},10000);
document.getElementById('revive').onclick=()=>{hero.dead=false;deadT=0;act=null;hurtT=0;hero.x=22;hero.y=22;hero.dir=Math.PI/2;hero.hp=hero.maxHp*.6;document.getElementById('deadModal').classList.remove('show');};
function toggleStats(){document.getElementById('statModal').classList.toggle('show');refreshStats();}
function refreshStats(){document.getElementById('pts').textContent=hero.pts;document.getElementById('mStr').textContent=hero.str;document.getElementById('mVit').textContent=hero.vit;document.getElementById('mAgi').textContent=hero.agi;document.getElementById('mInt').textContent=hero.int;document.getElementById('mLuk').textContent=hero.luk;document.querySelectorAll('.row button').forEach(b=>b.disabled=hero.pts<=0);}
document.getElementById('closeStat').onclick=()=>document.getElementById('statModal').classList.remove('show');
document.querySelectorAll('.row button').forEach(b=>b.onclick=()=>{if(hero.pts<=0)return;hero[b.dataset.st]++;hero.pts--;recalc();refreshStats();});
document.querySelectorAll('.sk').forEach(el=>el.onclick=()=>{if(el.id==='btnSave')saveGame(true);else if(el.id==='btnC')toggleStats();else cast(+el.dataset.sk);});
document.getElementById('chatBtn').onclick=()=>{document.getElementById('log').classList.toggle('open');};
log('ป่าแอชวูด — นักดาบอยู่กลางจอ','sys');
const SPR={dir:{},sets:{}};
let sprReady=false, act=null, hurtT=0, moving=false, running=false, deadT=0, faceLeft=false;
const qa={codes:null};
function keyDown(code,key){return qa.codes?qa.codes.has(code):!!keys[key];}
function facingLeft(){const c=Math.cos(hero.dir);if(Math.abs(c)>0.22)faceLeft=c<0;return faceLeft;}
function loadImg(src){return new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);const key=src.split('/').pop().split('?')[0].replace(/\.png$/,'');i.src=(window.SWORD_PACK&&window.SWORD_PACK[key])||src;});}
(async()=>{
  const b='sprites/swordman/';
  const q='?v=2';
  for(const d of ['front','right','back','left','f34','b34']) SPR.dir[d]=await loadImg(b+'dir_'+d+'.png'+q);
  const groups={idle:4,walk:3,run:3,atk1:3,atk2:3,skill:1,hurt:4,die:2,jump:4};
  for(const [g,n] of Object.entries(groups)){
    SPR.sets[g]=[];
    for(let i=0;i<n;i++){const im=await loadImg(b+g+'_'+i+'.png'+q); if(im) SPR.sets[g].push(im);}
  }
  sprReady=!!SPR.dir.front&&SPR.sets.idle.length>0&&SPR.sets.walk.length>0;
})();
function dirPose(dir){
  const d=(dir*180/Math.PI+360)%360, i=Math.round(d/45)%8;
  if(i===0) return ['left',false];
  if(i===1) return ['f34',false];
  if(i===2) return ['front',false];
  if(i===3) return ['f34',true];
  if(i===4) return ['right',false];
  if(i===5) return ['b34',true];
  if(i===6) return ['back',false];
  return ['b34',false];
}
function frameOf(name,t,dur){const a=SPR.sets[name];if(!a||!a.length)return null;return a[Math.min(a.length-1,Math.floor(t/Math.max(dur,.001)*a.length))];}
function blit(img,x,y,flip,bob){
  if(!img) return;
  const tall=img.height>160;
  const scale=tall?(118/img.height):(108/90);
  const w=img.width*scale, h=img.height*scale;
  ctx.save();ctx.translate(x,y+(bob||0));if(flip)ctx.scale(-1,1);
  ctx.imageSmoothingEnabled=false;ctx.drawImage(img,-w/2,-h+6,w,h);ctx.restore();
}
function w2s(x,y){return {x:(x-hero.x)*TILE+cv.width/2,y:(y-hero.y)*TILE+cv.height/2};}
function ellipse(x,y,rx,ry,col){ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill();}
function drawTree(t){const p=w2s(t.x,t.y);ellipse(p.x,p.y+10,10,5,'rgba(0,0,0,.28)');ctx.fillStyle='#4a3016';ctx.fillRect(p.x-5,p.y-16,10,26);ctx.fillStyle=t.k?'#1f5a2a':'#163f1e';ctx.beginPath();ctx.arc(p.x,p.y-28,17,0,Math.PI*2);ctx.fill();}
function drawWarrior(p){
  ellipse(p.x,p.y+8,16,6,'rgba(0,0,0,.35)');
  if(!sprReady){ctx.fillStyle='#c9a227';ctx.beginPath();ctx.arc(p.x,p.y-28,12,0,Math.PI*2);ctx.fill();ctx.fillStyle='#2a4a8a';ctx.fillRect(p.x-8,p.y-16,16,22);return;}
  const left=facingLeft();
  if(hero.dead){blit(frameOf('die',deadT,.48)||SPR.sets.die.at(-1),p.x,p.y,left,0);return;}
  if(act){
    if(act.name==='skill'&&act.t<0.16&&SPR.sets.jump.length){blit(frameOf('jump',act.t,.16),p.x,p.y-10,act.flip,0);return;}
    blit(frameOf(act.name,act.t,act.dur),p.x,p.y,act.flip,0);return;
  }
  if(hurtT>0){blit(frameOf('hurt',.36-hurtT,.36),p.x,p.y,left,0);return;}
  if(moving&&Math.abs(Math.cos(hero.dir))>0.38){
    const set=running?'run':'walk';
    const frames=SPR.sets[set];
    if(frames&&frames.length){blit(frames[Math.floor(hero.walk/(running?0.07:0.11))%frames.length],p.x,p.y,left,0);return;}
  }
  const [key,fl]=dirPose(hero.dir);
  if(!moving&&key==='front'){const frames=SPR.sets.idle;blit(frames[Math.floor(performance.now()/180)%frames.length],p.x,p.y,false,0);return;}
  blit(SPR.dir[key],p.x,p.y,fl,moving?Math.sin(hero.walk*9)*2:0);
}
function drawAnimal(en){const p=w2s(en.x,en.y);ellipse(p.x,p.y+12,13,5,'rgba(0,0,0,.3)');ctx.save();ctx.translate(p.x,p.y);
if(en.id==='wolf'){ellipse(0,2,16,9,'#4a4d5c');ellipse(12,-2,10,6,'#3a3d4a');ctx.fillStyle='#2a2c36';ctx.beginPath();ctx.moveTo(4,-8);ctx.lineTo(8,-16);ctx.lineTo(12,-6);ctx.fill();ctx.fillStyle='#d8d8e0';ctx.fillRect(18,-2,8,3);}
else if(en.id==='boar'){ellipse(0,4,15,10,'#6a3d28');ellipse(12,2,9,7,'#5a3020');ctx.fillStyle='#e8dcc0';ctx.fillRect(16,0,7,4);ctx.fillRect(8,-8,3,8);ctx.fillRect(12,-8,3,8);}
else if(en.id==='bear'){ellipse(0,2,18,13,'#5a3a22');ellipse(0,-10,10,8,'#4a2e1a');ctx.fillStyle='#4a2e1a';ctx.beginPath();ctx.arc(-8,-16,4,0,Math.PI*2);ctx.arc(8,-16,4,0,Math.PI*2);ctx.fill();}
else if(en.id==='fox'){ellipse(0,3,12,7,'#c45a28');ellipse(10,0,8,5,'#b44a20');ctx.fillStyle='#c45a28';ctx.beginPath();ctx.moveTo(4,-6);ctx.lineTo(8,-16);ctx.lineTo(12,-4);ctx.fill();ctx.fillStyle='#f3efe6';ctx.fillRect(16,-1,7,3);}
else if(en.id==='stag'){ellipse(0,3,14,9,'#8a5a32');ellipse(12,0,8,6,'#7a4a28');ctx.strokeStyle='#d8c48a';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(8,-8);ctx.lineTo(6,-20);ctx.moveTo(8,-8);ctx.lineTo(14,-18);ctx.stroke();}
else {ellipse(0,2,11,8,'#3a3a48');ctx.fillStyle='#c9c3b0';ctx.beginPath();ctx.ellipse(-6,-8,5,7,-0.3,0,Math.PI*2);ctx.ellipse(6,-8,5,7,0.3,0,Math.PI*2);ctx.fill();}
ctx.restore();ctx.fillStyle='#111';ctx.fillRect(p.x-16,p.y-28,32,5);ctx.fillStyle='#d24a3a';ctx.fillRect(p.x-16,p.y-28,32*(en.hp/en.maxHp),5);ctx.fillStyle='#f3e6c0';ctx.font='11px Noto Sans Thai,Tahoma';ctx.textAlign='center';ctx.fillText(en.name,p.x,p.y+24);}
let last=performance.now();
function tick(now){const dt=Math.min(.05,(now-last)/1000);last=now;requestAnimationFrame(tick);
resize();
if(act){act.t+=dt;if(act.t>=act.dur)act=null;}
hurtT=Math.max(0,hurtT-dt);
if(hero.dead)deadT+=dt; else deadT=0;
moving=false;running=false;
if(!hero.dead){hero.atkCd=Math.max(0,hero.atkCd-dt);hero.swing=Math.max(0,hero.swing-dt);for(const k of Object.keys(skills))skills[k].cd=Math.max(0,skills[k].cd-dt);
let mx=stick.mx,my=stick.my;if(keyDown('KeyW','w')||keyDown('ArrowUp','arrowup'))my-=1;if(keyDown('KeyS','s')||keyDown('ArrowDown','arrowdown'))my+=1;if(keyDown('KeyA','a')||keyDown('ArrowLeft','arrowleft'))mx-=1;if(keyDown('KeyD','d')||keyDown('ArrowRight','arrowright'))mx+=1;
if(Math.abs(mx)>0.12||Math.abs(my)>0.12){const l=Math.hypot(mx,my)||1,sp=(2.75+hero.agi*0.08)*dt;hero.x+=mx/l*sp;hero.y+=my/l*sp;hero.dir=Math.atan2(my,mx);hero.walk+=dt;moving=true;running=keyDown('ShiftLeft','shift')||keyDown('ShiftRight','shift')||Math.hypot(stick.mx,stick.my)>0.82;}
hero.x=Math.max(2,Math.min(MAP-2,hero.x));hero.y=Math.max(2,Math.min(MAP-2,hero.y));
hero.hp=Math.min(hero.maxHp,hero.hp+dt*(1.1+hero.vit*.08));hero.mp=Math.min(hero.maxMp,hero.mp+dt*(1.3+hero.int*.1));
for(const en of enemies){if(!en.alive)continue;en.atkCd=Math.max(0,en.atkCd-dt);const dx=hero.x-en.x,dy=hero.y-en.y,d=Math.hypot(dx,dy);
if(d<9){if(d>1.35){en.x+=dx/d*en.spd*dt;en.y+=dy/d*en.spd*dt;}else if(en.atkCd<=0){const dmg=en.dmg[0]+Math.floor(Math.random()*(en.dmg[1]-en.dmg[0]+1));hero.hp-=dmg;hurtT=.36;en.atkCd=1.15;log(en.name+' โจมตี '+dmg,'dmg');if(hero.hp<=0){hero.dead=true;hero.hp=0;act=null;document.getElementById('deadModal').classList.add('show');}}}
else{en.wander+=dt;en.x+=Math.cos(en.wander)*0.35*dt;en.y+=Math.sin(en.wander*.8)*0.35*dt;}}}
ctx.fillStyle='#121a14';ctx.fillRect(0,0,cv.width,cv.height);
const startX=Math.floor(hero.x-cv.width/TILE/2)-1,startY=Math.floor(hero.y-cv.height/TILE/2)-1;
for(let gy=startY;gy<startY+cv.height/TILE+3;gy++){for(let gx=startX;gx<startX+cv.width/TILE+3;gx++){const p=w2s(gx,gy);ctx.fillStyle=((gx+gy)&1)?'#1c2a1c':'#172318';ctx.fillRect(p.x,p.y,TILE+1,TILE+1);}}
const list=trees.map(t=>({y:t.y,k:'t',t}));enemies.filter(e=>e.alive).forEach(e=>list.push({y:e.y,k:'e',e}));list.push({y:hero.y,k:'h'});list.sort((a,b)=>a.y-b.y);
for(const o of list){if(o.k==='t')drawTree(o.t);else if(o.k==='e')drawAnimal(o.e);else drawWarrior({x:cv.width/2,y:cv.height/2});}
document.getElementById('lvl').textContent=hero.lvl;document.getElementById('hpTxt').textContent=Math.floor(hero.hp)+'/'+hero.maxHp;document.getElementById('mpTxt').textContent=Math.floor(hero.mp)+'/'+hero.maxMp;document.getElementById('expTxt').textContent=Math.floor(hero.exp)+'/'+hero.next;
document.getElementById('hpFill').style.width=(100*hero.hp/hero.maxHp)+'%';document.getElementById('mpFill').style.width=(100*hero.mp/hero.maxMp)+'%';document.getElementById('expFill').style.width=(100*hero.exp/hero.next)+'%';
document.getElementById('sStr').textContent=hero.str;document.getElementById('sVit').textContent=hero.vit;document.getElementById('sAgi').textContent=hero.agi;document.getElementById('sInt').textContent=hero.int;document.getElementById('sLuk').textContent=hero.luk;
const pl=document.getElementById('ptsLabel');if(hero.pts){pl.style.display='inline-block';pl.textContent='+'+hero.pts+' แต้ม';}else pl.style.display='none';
}
requestAnimationFrame(tick);
window.__controlsTest={
  setKeys(codes){qa.codes=new Set(codes||[]);},
  getX(){return hero.x;},
  getY(){return hero.y;},
  getYaw(){return hero.dir;},
  getSpeed(){return moving?3:0;},
  sprites(){return sprReady;},
  pose(){return {dead:hero.dead,act:act&&act.name,moving,running,dir:hero.dir,hurt:hurtT};},
  place(x,y){hero.x=x;hero.y=y;},
  hit(){hurtT=.36;},
  kill(){hero.dead=true;hero.hp=0;act=null;deadT=0;}
};
</script>
</body></html>
