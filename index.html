<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/><title>Ashwood 2.5D</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Noto+Sans+Thai:wght@400;600&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#070a08;color:#f1e6c8;font-family:'Noto Sans Thai',sans-serif;user-select:none;touch-action:none}
canvas{display:block;width:100%;height:100%;touch-action:none}
.glass{background:linear-gradient(180deg,rgba(18,22,16,.92),rgba(10,12,9,.88));border:1px solid rgba(212,175,55,.35);border-radius:16px}
#panel{position:fixed;left:16px;top:16px;width:270px;padding:12px 14px}
.bar{height:10px;background:#14140f;border-radius:99px;overflow:hidden;margin:2px 0 7px}.bar i{display:block;height:100%}
#hpFill{background:linear-gradient(90deg,#7a1e18,#e14b3a)}#mpFill{background:linear-gradient(90deg,#1d3f7a,#4d8fe8)}#expFill{background:linear-gradient(90deg,#8a6a12,#f0c14a);width:0}
.chip{background:#1b1a14;border:1px solid #3d3420;border-radius:999px;padding:3px 7px;font-size:12px}
#hint{position:fixed;top:14px;left:50%;transform:translateX(-50%);font-size:12px;color:#d7c58a;background:rgba(0,0,0,.35);padding:6px 12px;border-radius:999px}
#skills{position:fixed;left:16px;bottom:16px;display:flex;gap:8px}
.sk{width:58px;height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px}
.sk b{font-family:Cinzel,serif;color:#f0c14a}
#chatBtn{position:fixed;right:16px;bottom:16px;z-index:9;min-width:64px;height:40px;padding:0 12px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:12px}
#log{position:fixed;right:16px;bottom:64px;width:250px;max-height:110px;overflow:auto;padding:8px;font-size:12px;display:none}
#log.open{display:block}
#log .gold{color:#f0c14a}#log .dmg{color:#ff7a6a}#log .sys{color:#c9b27a}
#statModal,#deadModal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55)}
#statModal.show,#deadModal.show{display:flex}
.modal{width:min(92vw,400px);padding:18px}
.row{display:grid;grid-template-columns:60px 1fr 36px 34px;gap:8px;margin:8px 0;align-items:center}
.row button,.btn{background:#2b2414;color:#f0c14a;border:1px solid #6a5420;border-radius:8px;height:30px}
.btn{margin-top:12px;padding:8px 14px;height:auto}
#joy{position:fixed;left:16px;bottom:18px;width:128px;height:128px;border-radius:50%;background:rgba(20,22,16,.45);border:2px solid rgba(212,175,55,.35);z-index:8}
#joyKnob{position:absolute;left:44px;top:44px;width:40px;height:40px;border-radius:50%;background:rgba(240,193,74,.9)}
#atkBtn{position:fixed;right:14px;bottom:148px;width:72px;height:72px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#f0c14a;z-index:8}
@media(max-width:900px){#hint{display:none}#panel{left:8px;top:8px;width:min(68vw,220px);padding:8px 10px}#panel .stats{display:none}.bar{height:8px}#skills{left:auto;right:8px;bottom:8px;width:132px;flex-wrap:wrap;justify-content:flex-end}.sk{width:60px;height:56px}#chatBtn{top:8px;bottom:auto;right:8px;height:34px}#log{top:46px;bottom:auto;right:8px;width:min(68vw,240px);max-height:26vh}}
@media(min-width:901px){#joy,#atkBtn{display:none}#log{display:block}#chatBtn{display:none}}
</style></head><body>
<canvas id="cv"></canvas>
<div id="joy"><div id="joyKnob"></div></div>
<div id="atkBtn" class="glass">ATK</div>
<div id="panel" class="glass"><div style="display:flex;justify-content:space-between"><b>Warrior</b><span>Lv. <b id="lvl">1</b></span></div>
<div style="font-size:11px;display:flex;justify-content:space-between"><span>HP</span><span id="hpTxt"></span></div><div class="bar"><i id="hpFill"></i></div>
<div style="font-size:11px;display:flex;justify-content:space-between"><span>MP</span><span id="mpTxt"></span></div><div class="bar"><i id="mpFill"></i></div>
<div style="font-size:11px;display:flex;justify-content:space-between"><span>EXP</span><span id="expTxt"></span></div><div class="bar"><i id="expFill"></i></div>
<div class="stats" style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px"><span class="chip">STR <b id="sStr">8</b></span><span class="chip">VIT <b id="sVit">8</b></span><span class="chip">AGI <b id="sAgi">8</b></span><span class="chip">INT <b id="sInt">6</b></span><span class="chip">LUK <b id="sLuk">5</b></span><span class="chip" id="ptsLabel" style="display:none;color:#f0c14a"></span></div></div>
<div id="hint">WASD · ATK · skills · C stats</div>
<div id="skills"><div class="sk glass" data-sk="1"><b>1</b>Hit</div><div class="sk glass" data-sk="2"><b>2</b>Spin</div><div class="sk glass" data-sk="3"><b>3</b>Dash</div><div class="sk glass" id="btnC"><b>C</b>Stats</div><div class="sk glass" id="btnSave"><b>SV</b>Save</div></div>
<div id="chatBtn" class="glass">Chat</div>
<div id="log" class="glass"></div>
<div id="statModal"><div class="modal glass"><h2>CHARACTER</h2><div>Points <b id="pts">0</b></div>
<div class="row"><span>STR</span><span>ATK</span><b id="mStr">8</b><button data-st="str">+</button></div>
<div class="row"><span>VIT</span><span>HP</span><b id="mVit">8</b><button data-st="vit">+</button></div>
<div class="row"><span>AGI</span><span>SPD</span><b id="mAgi">8</b><button data-st="agi">+</button></div>
<div class="row"><span>INT</span><span>MP</span><b id="mInt">6</b><button data-st="int">+</button></div>
<div class="row"><span>LUK</span><span>CRIT</span><b id="mLuk">5</b><button data-st="luk">+</button></div>
<button class="btn" id="closeStat">Close</button></div></div>
<div id="deadModal"><div class="modal glass" style="text-align:center"><h2>YOU DIED</h2><button class="btn" id="revive">Revive</button></div></div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
function resize(){cv.width=innerWidth;cv.height=innerHeight;}addEventListener('resize',resize);resize();
const TILE=52,MAP=90,logEl=document.getElementById('log');
function log(m,c='sys'){const d=document.createElement('div');d.className=c;d.textContent=m;logEl.prepend(d);while(logEl.children.length>8)logEl.lastChild.remove();}
const hero={x:22,y:22,dir:0,lvl:1,exp:0,next:80,str:8,vit:8,agi:8,int:6,luk:5,pts:0,hp:0,maxHp:0,mp:0,maxMp:0,atkCd:0,dead:false,swing:0,walk:0};
function recalc(){hero.maxHp=90+hero.vit*12+(hero.lvl-1)*8;hero.maxMp=28+hero.int*6;hero.hp=Math.min(hero.hp||hero.maxHp,hero.maxHp);hero.mp=Math.min(hero.mp||hero.maxMp,hero.maxMp);}recalc();hero.hp=hero.maxHp;hero.mp=hero.maxMp;
const trees=[];(function(){let s=918273;function rng(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296;}for(let i=0;i<240;i++)trees.push({x:2+rng()*(MAP-4),y:2+rng()*(MAP-4),k:rng()>.7?1:0});}());
const types=[{id:'wolf',name:'Wolf',hp:58,exp:26,spd:2.15,dmg:[7,12]},{id:'boar',name:'Boar',hp:80,exp:32,spd:1.7,dmg:[9,15]},{id:'bear',name:'Bear',hp:140,exp:55,spd:1.15,dmg:[14,22]},{id:'fox',name:'Fox',hp:42,exp:20,spd:2.4,dmg:[5,9]},{id:'stag',name:'Stag',hp:70,exp:30,spd:1.9,dmg:[8,13]},{id:'owl',name:'Owl',hp:48,exp:24,spd:2.2,dmg:[6,11]}];
const enemies=[];function spawn(id,n,cx,cy){const t=types.find(v=>v.id===id);for(let i=0;i<n;i++)enemies.push({x:cx+(Math.random()-.5)*9,y:cy+(Math.random()-.5)*9,id:t.id,name:t.name,hp:t.hp,maxHp:t.hp,exp:t.exp,spd:t.spd,dmg:t.dmg,alive:true,atkCd:0,wander:Math.random()*6});}
spawn('fox',5,30,20);spawn('wolf',4,38,28);spawn('boar',3,48,22);spawn('stag',3,28,38);spawn('owl',3,52,36);spawn('bear',2,44,44);spawn('wolf',3,18,34);
const keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key==='c'||e.key==='C')toggleStats();if(e.key==='1')cast(1);if(e.key==='2')cast(2);if(e.key==='3')cast(3);if(e.key==='F5'){e.preventDefault();saveGame(true);}});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
const stick={mx:0,my:0,active:false};const joy=document.getElementById('joy'),knob=document.getElementById('joyKnob');
function setStick(x,y){const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=x-cx,dy=y-cy;const max=r.width*0.32,l=Math.hypot(dx,dy)||1;if(l>max){dx=dx/l*max;dy=dy/l*max;}knob.style.left=(r.width/2-20+dx)+'px';knob.style.top=(r.height/2-20+dy)+'px';stick.mx=dx/max;stick.my=dy/max;}
function endStick(){stick.active=false;stick.mx=0;stick.my=0;knob.style.left='44px';knob.style.top='44px';}
joy.addEventListener('pointerdown',e=>{e.preventDefault();joy.setPointerCapture(e.pointerId);stick.active=true;setStick(e.clientX,e.clientY);});
joy.addEventListener('pointermove',e=>{if(stick.active)setStick(e.clientX,e.clientY);});
joy.addEventListener('pointerup',endStick);joy.addEventListener('pointercancel',endStick);
document.getElementById('atkBtn').addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();swing();});
addEventListener('mousedown',e=>{if(e.button===0&&e.target===cv)swing();});
document.body.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
const skills={1:{cd:0,max:.32,mp:0},2:{cd:0,max:4,mp:12},3:{cd:0,max:5.2,mp:16}};
function atk(){const crit=Math.random()<(0.05+hero.luk*0.008);return {d:Math.round((10+hero.str*2.2+hero.lvl)*(crit?1.8:1)*(0.9+Math.random()*0.22)),crit};}
function nearest(range){let best=null,bd=range;for(const en of enemies){if(!en.alive)continue;const d=Math.hypot(en.x-hero.x,en.y-hero.y);if(d<bd){bd=d;best=en;}}return best;}
function deal(en,dmg,crit){en.hp-=dmg;log((crit?'CRIT ':'')+dmg+' -> '+en.name,crit?'gold':'dmg');if(en.hp<=0){en.alive=false;hero.exp+=en.exp;log(en.name+' +'+en.exp+' EXP','gold');while(hero.exp>=hero.next)levelUp();setTimeout(()=>{en.alive=true;en.hp=en.maxHp;},15000);}}
function swing(){if(hero.dead||hero.atkCd>0)return;hero.atkCd=Math.max(.26,.48-hero.agi*0.01);hero.swing=0.22;const a=atk(),en=nearest(2.15);if(en)deal(en,a.d,a.crit);}
function whirl(){const a=atk();for(const en of enemies){if(!en.alive)continue;if(Math.hypot(en.x-hero.x,en.y-hero.y)<3.3)deal(en,Math.round(a.d*1.28),a.crit);}hero.swing=0.28;}
function dash(){hero.x+=Math.cos(hero.dir)*2.3;hero.y+=Math.sin(hero.dir)*2.3;const a=atk(),en=nearest(2.6);if(en)deal(en,Math.round(a.d*1.5),a.crit);}
function cast(id){if(hero.dead)return;const s=skills[id];if(!s||s.cd>0)return;if(hero.mp<s.mp){log('no MP','sys');return;}hero.mp-=s.mp;s.cd=s.max;if(id===1)swing();if(id===2)whirl();if(id===3)dash();}
function levelUp(){hero.exp-=hero.next;hero.lvl++;hero.next=Math.round(70*Math.pow(1.22,hero.lvl-1));hero.pts+=5;recalc();hero.hp=hero.maxHp;hero.mp=hero.maxMp;document.getElementById('statModal').classList.add('show');refreshStats();}
function saveGame(m){try{localStorage.setItem('ashwood-25d-v2',JSON.stringify(hero));if(m)log('saved','gold');}catch(e){}}
function loadGame(){try{const raw=localStorage.getItem('ashwood-25d-v2');if(!raw)return;Object.assign(hero,JSON.parse(raw));recalc();hero.dead=false;}catch(e){}}
loadGame();setInterval(()=>{if(!hero.dead)saveGame(false);},10000);
document.getElementById('revive').onclick=()=>{hero.dead=false;hero.x=22;hero.y=22;hero.hp=hero.maxHp*.6;document.getElementById('deadModal').classList.remove('show');};
function toggleStats(){document.getElementById('statModal').classList.toggle('show');refreshStats();}
function refreshStats(){document.getElementById('pts').textContent=hero.pts;document.getElementById('mStr').textContent=hero.str;document.getElementById('mVit').textContent=hero.vit;document.getElementById('mAgi').textContent=hero.agi;document.getElementById('mInt').textContent=hero.int;document.getElementById('mLuk').textContent=hero.luk;document.querySelectorAll('.row button').forEach(b=>b.disabled=hero.pts<=0);}
document.getElementById('closeStat').onclick=()=>document.getElementById('statModal').classList.remove('show');
document.querySelectorAll('.row button').forEach(b=>b.onclick=()=>{if(hero.pts<=0)return;hero[b.dataset.st]++;hero.pts--;recalc();refreshStats();});
document.querySelectorAll('.sk').forEach(el=>el.onclick=()=>{if(el.id==='btnSave')saveGame(true);else if(el.id==='btnC')toggleStats();else cast(+el.dataset.sk);});
document.getElementById('chatBtn').onclick=()=>document.getElementById('log').classList.toggle('open');
function w2s(x,y){return {x:(x-hero.x)*TILE+cv.width/2,y:(y-hero.y)*TILE+cv.height/2};}
function ellipse(x,y,rx,ry,col){ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill();}
function drawTree(t){const p=w2s(t.x,t.y);ellipse(p.x,p.y+10,10,5,'rgba(0,0,0,.28)');ctx.fillStyle='#4a3016';ctx.fillRect(p.x-5,p.y-16,10,26);ctx.fillStyle=t.k?'#1f5a2a':'#163f1e';ctx.beginPath();ctx.arc(p.x,p.y-28,17,0,Math.PI*2);ctx.fill();}
function drawWarrior(p,dir,swing,walk){const bob=Math.sin(walk*10)*1.5;ctx.save();ctx.translate(p.x,p.y+bob);ellipse(0,18,15,6,'rgba(0,0,0,.32)');ctx.fillStyle='#3a2a1c';ctx.fillRect(-8,2,7,16);ctx.fillRect(2,2,7,16);ctx.fillStyle='#2a3344';ctx.fillRect(-11,-10,22,20);ctx.fillStyle='#c9a227';ctx.fillRect(-12,-6,24,5);ctx.fillStyle='#f0d2a8';ctx.beginPath();ctx.arc(0,-18,9,0,Math.PI*2);ctx.fill();ctx.fillStyle='#5b1f1c';ctx.fillRect(-10,-26,20,8);ctx.save();ctx.rotate(dir+(swing>0?0.9:0.15));ctx.fillStyle='#e8d7a0';ctx.fillRect(14,-2,22,4);ctx.restore();ctx.fillStyle='#fff4c4';ctx.font='bold 12px Tahoma';ctx.textAlign='center';ctx.fillText('YOU',0,34);ctx.restore();}
function drawAnimal(en){const p=w2s(en.x,en.y);ellipse(p.x,p.y+12,13,5,'rgba(0,0,0,.3)');ctx.save();ctx.translate(p.x,p.y);
if(en.id==='wolf'){ellipse(0,2,16,9,'#4a4d5c');ellipse(12,-2,10,6,'#3a3d4a');}
else if(en.id==='boar'){ellipse(0,4,15,10,'#6a3d28');ellipse(12,2,9,7,'#5a3020');}
else if(en.id==='bear'){ellipse(0,2,18,13,'#5a3a22');ellipse(0,-10,10,8,'#4a2e1a');}
else if(en.id==='fox'){ellipse(0,3,12,7,'#c45a28');ellipse(10,0,8,5,'#b44a20');}
else if(en.id==='stag'){ellipse(0,3,14,9,'#8a5a32');}
else {ellipse(0,2,11,8,'#3a3a48');}
ctx.restore();ctx.fillStyle='#111';ctx.fillRect(p.x-16,p.y-28,32,5);ctx.fillStyle='#d24a3a';ctx.fillRect(p.x-16,p.y-28,32*(en.hp/en.maxHp),5);ctx.fillStyle='#f3e6c0';ctx.font='11px Tahoma';ctx.textAlign='center';ctx.fillText(en.name,p.x,p.y+24);}
let last=performance.now();
function tick(now){const dt=Math.min(.05,(now-last)/1000);last=now;requestAnimationFrame(tick);
if(!hero.dead){hero.atkCd=Math.max(0,hero.atkCd-dt);hero.swing=Math.max(0,hero.swing-dt);for(const k of Object.keys(skills))skills[k].cd=Math.max(0,skills[k].cd-dt);
let mx=stick.mx,my=stick.my;if(keys.w||keys.arrowup)my-=1;if(keys.s||keys.arrowdown)my+=1;if(keys.a||keys.arrowleft)mx-=1;if(keys.d||keys.arrowright)mx+=1;
if(Math.abs(mx)>0.12||Math.abs(my)>0.12){const l=Math.hypot(mx,my)||1,sp=(2.75+hero.agi*0.08)*dt;hero.x+=mx/l*sp;hero.y+=my/l*sp;hero.dir=Math.atan2(my,mx);hero.walk+=dt;}
hero.x=Math.max(2,Math.min(MAP-2,hero.x));hero.y=Math.max(2,Math.min(MAP-2,hero.y));
hero.hp=Math.min(hero.maxHp,hero.hp+dt*(1.1+hero.vit*.08));hero.mp=Math.min(hero.maxMp,hero.mp+dt*(1.3+hero.int*.1));
for(const en of enemies){if(!en.alive)continue;en.atkCd=Math.max(0,en.atkCd-dt);const dx=hero.x-en.x,dy=hero.y-en.y,d=Math.hypot(dx,dy);
if(d<9){if(d>1.35){en.x+=dx/d*en.spd*dt;en.y+=dy/d*en.spd*dt;}else if(en.atkCd<=0){const dmg=en.dmg[0]+Math.floor(Math.random()*(en.dmg[1]-en.dmg[0]+1));hero.hp-=dmg;en.atkCd=1.15;if(hero.hp<=0){hero.dead=true;hero.hp=0;document.getElementById('deadModal').classList.add('show');}}}else{en.wander+=dt;en.x+=Math.cos(en.wander)*0.35*dt;en.y+=Math.sin(en.wander*.8)*0.35*dt;}}}
ctx.fillStyle='#121a14';ctx.fillRect(0,0,cv.width,cv.height);
const startX=Math.floor(hero.x-cv.width/TILE/2)-1,startY=Math.floor(hero.y-cv.height/TILE/2)-1;
for(let gy=startY;gy<startY+cv.height/TILE+3;gy++){for(let gx=startX;gx<startX+cv.width/TILE+3;gx++){const p=w2s(gx,gy);ctx.fillStyle=((gx+gy)&1)?'#1c2a1c':'#172318';ctx.fillRect(p.x,p.y,TILE+1,TILE+1);}}
const list=trees.map(t=>({y:t.y,k:'t',t}));enemies.filter(e=>e.alive).forEach(e=>list.push({y:e.y,k:'e',e}));list.push({y:hero.y,k:'h'});list.sort((a,b)=>a.y-b.y);
for(const o of list){if(o.k==='t')drawTree(o.t);else if(o.k==='e')drawAnimal(o.e);else drawWarrior({x:cv.width/2,y:cv.height/2},hero.dir,hero.swing,hero.walk);}
document.getElementById('lvl').textContent=hero.lvl;document.getElementById('hpTxt').textContent=Math.floor(hero.hp)+'/'+hero.maxHp;document.getElementById('mpTxt').textContent=Math.floor(hero.mp)+'/'+hero.maxMp;document.getElementById('expTxt').textContent=Math.floor(hero.exp)+'/'+hero.next;
document.getElementById('hpFill').style.width=(100*hero.hp/hero.maxHp)+'%';document.getElementById('mpFill').style.width=(100*hero.mp/hero.maxMp)+'%';document.getElementById('expFill').style.width=(100*hero.exp/hero.next)+'%';
document.getElementById('sStr').textContent=hero.str;document.getElementById('sVit').textContent=hero.vit;document.getElementById('sAgi').textContent=hero.agi;document.getElementById('sInt').textContent=hero.int;document.getElementById('sLuk').textContent=hero.luk;
const pl=document.getElementById('ptsLabel');if(hero.pts){pl.style.display='inline-block';pl.textContent='+'+hero.pts;}else pl.style.display='none';
}
requestAnimationFrame(tick);
</script></body></html>
