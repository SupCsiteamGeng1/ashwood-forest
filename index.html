<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Ashwood 3D</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#071109;color:#ead9b0;font-family:Tahoma,sans-serif;user-select:none}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;inset:0;pointer-events:none}
.panel{pointer-events:auto;background:rgba(8,10,7,.86);border:1px solid rgba(201,162,39,.4);padding:10px 14px;margin:12px;width:260px}
.bar{height:10px;background:#16140f;margin:3px 0 7px}.bar i{display:block;height:100%}
#hpFill{background:#c23b2e;width:100%}#mpFill{background:#3a6aa8;width:100%}#expFill{background:#d4a017;width:0}
#hint{position:fixed;top:12px;left:50%;transform:translateX(-50%);font-size:12px;color:#c9b27a;text-shadow:0 2px 6px #000}
#skills{position:fixed;left:12px;bottom:12px;display:flex;gap:8px;pointer-events:auto}
.sk{width:52px;height:52px;background:#16140f;border:1px solid #6a5420;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;cursor:pointer}
.sk b{color:#c9a227;font-size:14px}
#log{position:fixed;right:12px;bottom:12px;width:280px;max-height:110px;overflow:hidden;font-size:12px;background:rgba(8,10,7,.86);padding:8px}
#log .gold{color:#f0c14a}#log .dmg{color:#ff6b5a}#log .sys{color:#c9b27a}
#statModal,#deadModal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55);pointer-events:auto}
#statModal.show,#deadModal.show{display:flex}
.modal{width:380px;background:#12140f;border:1px solid #c9a227;padding:18px}
.row{display:grid;grid-template-columns:60px 1fr 40px 32px;gap:8px;margin:8px 0;align-items:center}
.row button,.btn{background:#2a2414;color:#c9a227;border:1px solid #6a5420;height:28px;cursor:pointer}
.btn{margin-top:12px;padding:8px 16px;height:auto}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud"><div class="panel">
<div style="display:flex;justify-content:space-between"><b>Ashwood</b><span>Lv. <b id="lvl">1</b></span></div>
<div>HP <span id="hpTxt"></span><div class="bar"><i id="hpFill"></i></div></div>
<div>MP <span id="mpTxt"></span><div class="bar"><i id="mpFill"></i></div></div>
<div>EXP <span id="expTxt"></span><div class="bar"><i id="expFill"></i></div></div>
<div style="font-size:12px">STR <b id="sStr">8</b> VIT <b id="sVit">8</b> AGI <b id="sAgi">8</b> INT <b id="sInt">6</b> LUK <b id="sLuk">5</b> <span id="ptsLabel"></span></div>
</div></div>
<div id="hint">WASD walk | Right-drag camera | Click attack | 1-3 skill | C stats | F5 save</div>
<div id="skills">
<div class="sk" data-sk="1"><b>1</b>Hit</div>
<div class="sk" data-sk="2"><b>2</b>Spin</div>
<div class="sk" data-sk="3"><b>3</b>Dash</div>
<div class="sk" id="btnC"><b>C</b>Stats</div>
<div class="sk" id="btnSave"><b>F5</b>Save</div>
</div>
<div id="log"></div>
<div id="statModal"><div class="modal"><h2>CHARACTER</h2><div>Points <b id="pts">0</b></div>
<div class="row"><span>STR</span><span>ATK</span><b id="mStr">8</b><button data-st="str">+</button></div>
<div class="row"><span>VIT</span><span>HP</span><b id="mVit">8</b><button data-st="vit">+</button></div>
<div class="row"><span>AGI</span><span>SPD</span><b id="mAgi">8</b><button data-st="agi">+</button></div>
<div class="row"><span>INT</span><span>MP</span><b id="mInt">6</b><button data-st="int">+</button></div>
<div class="row"><span>LUK</span><span>CRIT</span><b id="mLuk">5</b><button data-st="luk">+</button></div>
<button class="btn" id="closeStat">Close</button></div></div>
<div id="deadModal"><div class="modal" style="text-align:center"><h2>YOU DIED</h2><button class="btn" id="revive">Revive</button></div></div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
function resize(){cv.width=innerWidth;cv.height=innerHeight;} addEventListener('resize',resize);resize();
const logEl=document.getElementById('log');
function log(m,c='sys'){const d=document.createElement('div');d.className=c;d.textContent=m;logEl.prepend(d);while(logEl.children.length>7)logEl.lastChild.remove();}
const SAVE_KEY='ashwood-soft3d-v1';
const hero={x:0,z:0,yaw:0,lvl:1,exp:0,next:80,str:8,vit:8,agi:8,int:6,luk:5,pts:0,hp:0,maxHp:0,mp:0,maxMp:0,atkCd:0,dead:false};
function recalc(){hero.maxHp=90+hero.vit*12+(hero.lvl-1)*8;hero.maxMp=28+hero.int*6;hero.hp=Math.min(hero.hp||hero.maxHp,hero.maxHp);hero.mp=Math.min(hero.mp||hero.maxMp,hero.maxMp);} recalc();hero.hp=hero.maxHp;hero.mp=hero.maxMp;
let camYaw=0.7; const trees=[];
for(let i=0;i<70;i++){const a=Math.random()*Math.PI*2,r=12+Math.random()*70;trees.push({x:Math.cos(a)*r,z:Math.sin(a)*r,h:3.2+Math.random()*1.8,s:0.8+Math.random()*0.5});}
const types=[{name:'Imp',col:'#8a3328',hp:38,exp:18,spd:2.4,dmg:[4,8],s:0.7},{name:'Wolf',col:'#4a4a58',hp:62,exp:28,spd:3.2,dmg:[7,12],s:0.9},{name:'Brute',col:'#4a5a30',hp:120,exp:48,spd:1.6,dmg:[12,20],s:1.3},{name:'Wraith',col:'#5a6a88',hp:80,exp:36,spd:2.7,dmg:[8,14],s:1}];
const enemies=[];
function spawn(k,n,r0){for(let i=0;i<n;i++){const t=types[k],a=Math.random()*Math.PI*2,r=r0+Math.random()*10;enemies.push({x:Math.cos(a)*r,z:Math.sin(a)*r,name:t.name,col:t.col,hp:t.hp,maxHp:t.hp,exp:t.exp,spd:t.spd,dmg:t.dmg,s:t.s,alive:true,atkCd:0,wander:Math.random()*6});}}
spawn(0,6,16);spawn(1,5,24);spawn(2,3,32);spawn(3,4,40);
const keys={};
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key==='c'||e.key==='C')toggleStats();if(e.key==='1')cast(1);if(e.key==='2')cast(2);if(e.key==='3')cast(3);if(e.key==='F5'){e.preventDefault();saveGame(true);}if(e.key==='F9'){e.preventDefault();loadGame(true);}});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
let drag=false;
addEventListener('mousedown',e=>{if(e.button===2||e.button===1)drag=true;if(e.button===0)swing();});
addEventListener('mouseup',()=>drag=false);
addEventListener('mousemove',e=>{if(drag)camYaw-=e.movementX*0.006;});
addEventListener('contextmenu',e=>e.preventDefault());
const skills={1:{cd:0,max:.35,mp:0},2:{cd:0,max:4,mp:12},3:{cd:0,max:5,mp:16}};
function atk(){const crit=Math.random()<(0.05+hero.luk*0.008);return {d:Math.round((10+hero.str*2.2+hero.lvl)*(crit?1.8:1)*(0.9+Math.random()*0.22)),crit};}
function nearest(range){let best=null,bd=range;for(const en of enemies){if(!en.alive)continue;const d=Math.hypot(en.x-hero.x,en.z-hero.z);if(d<bd){bd=d;best=en;}}return best;}
function deal(en,dmg,crit){en.hp-=dmg;log((crit?'CRIT ':'')+dmg+' -> '+en.name,crit?'gold':'dmg');if(en.hp<=0){en.alive=false;hero.exp+=en.exp;log(en.name+' +'+en.exp+' EXP','gold');while(hero.exp>=hero.next)levelUp();setTimeout(()=>{en.alive=true;en.hp=en.maxHp;},14000);}}
function swing(){if(hero.dead||hero.atkCd>0)return;hero.atkCd=Math.max(.28,.5-hero.agi*0.01);const a=atk(),en=nearest(3.4);if(en)deal(en,a.d,a.crit);else log('miss','sys');}
function whirl(){const a=atk();for(const en of enemies){if(!en.alive)continue;if(Math.hypot(en.x-hero.x,en.z-hero.z)<5.2)deal(en,Math.round(a.d*1.3),a.crit);}}
function dash(){hero.x+=Math.sin(hero.yaw)*6;hero.z+=Math.cos(hero.yaw)*6;const a=atk(),en=nearest(4);if(en)deal(en,Math.round(a.d*1.55),a.crit);}
function cast(id){if(hero.dead)return;const s=skills[id];if(!s||s.cd>0)return;if(hero.mp<s.mp){log('no MP','sys');return;}hero.mp-=s.mp;s.cd=s.max;if(id===1)swing();if(id===2)whirl();if(id===3)dash();}
function levelUp(){hero.exp-=hero.next;hero.lvl++;hero.next=Math.round(70*Math.pow(1.22,hero.lvl-1));hero.pts+=5;recalc();hero.hp=hero.maxHp;hero.mp=hero.maxMp;log('LEVEL UP '+hero.lvl,'gold');document.getElementById('statModal').classList.add('show');refreshStats();}
function saveGame(m){try{localStorage.setItem(SAVE_KEY,JSON.stringify(hero));if(m)log('saved','gold');}catch(e){}}
function loadGame(m){try{const raw=localStorage.getItem(SAVE_KEY);if(!raw){if(m)log('no save','sys');return;}Object.assign(hero,JSON.parse(raw));recalc();hero.dead=false;if(m)log('loaded Lv.'+hero.lvl,'gold');}catch(e){}}
loadGame(false);setInterval(()=>{if(!hero.dead)saveGame(false);},10000);
document.getElementById('revive').onclick=()=>{hero.dead=false;hero.x=0;hero.z=0;hero.hp=hero.maxHp*.6;document.getElementById('deadModal').classList.remove('show');};
function toggleStats(){document.getElementById('statModal').classList.toggle('show');refreshStats();}
function refreshStats(){document.getElementById('pts').textContent=hero.pts;document.getElementById('mStr').textContent=hero.str;document.getElementById('mVit').textContent=hero.vit;document.getElementById('mAgi').textContent=hero.agi;document.getElementById('mInt').textContent=hero.int;document.getElementById('mLuk').textContent=hero.luk;document.querySelectorAll('.row button').forEach(b=>b.disabled=hero.pts<=0);}
document.getElementById('closeStat').onclick=()=>document.getElementById('statModal').classList.remove('show');
document.querySelectorAll('.row button').forEach(b=>b.onclick=()=>{if(hero.pts<=0)return;hero[b.dataset.st]++;hero.pts--;recalc();refreshStats();});
document.querySelectorAll('.sk').forEach(el=>el.onclick=()=>{if(el.id==='btnSave')saveGame(true);else if(el.id==='btnC')toggleStats();else cast(+el.dataset.sk);});
log('Ashwood 3D ready','sys');
function project(x,y,z){const dx=x-hero.x,dz=z-hero.z;const c=Math.cos(-camYaw),s=Math.sin(-camYaw);const rx=dx*c-dz*s,rz=dx*s+dz*c;const camY=3.2,depth=rz+7;if(depth<0.4)return null;const f=520/depth;return {x:cv.width/2+rx*f,y:cv.height*0.62-(y-camY)*f,s:f,depth};}
function drawGround(){const g=ctx.createLinearGradient(0,cv.height*0.45,0,cv.height);g.addColorStop(0,'#24361c');g.addColorStop(1,'#10180e');ctx.fillStyle=g;ctx.fillRect(0,cv.height*0.45,cv.width,cv.height*0.55);ctx.strokeStyle='rgba(90,120,70,.18)';ctx.lineWidth=1;for(let i=-8;i<=8;i++){const a=project(hero.x+i*6,0,hero.z-40),b=project(hero.x+i*6,0,hero.z+50);if(a&&b){ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();}}}
function drawSky(){const g=ctx.createLinearGradient(0,0,0,cv.height*0.5);g.addColorStop(0,'#0c1410');g.addColorStop(1,'#1a2818');ctx.fillStyle=g;ctx.fillRect(0,0,cv.width,cv.height);}
function drawTree(t){const base=project(t.x,0,t.z);if(!base)return;const top=project(t.x,t.h,t.z);if(!top)return;const w=0.35*t.s*base.s;ctx.fillStyle='#4a3018';ctx.fillRect(base.x-w*0.18,top.y+(base.y-top.y)*0.35,w*0.36,base.y-(top.y+(base.y-top.y)*0.35));ctx.fillStyle='#1c4a24';ctx.beginPath();ctx.moveTo(base.x,top.y);ctx.lineTo(base.x+w,base.y*0.35+top.y*0.65);ctx.lineTo(base.x-w,base.y*0.35+top.y*0.65);ctx.closePath();ctx.fill();}
function drawActor(x,z,col,s,isHero){const p=project(x,0,z);if(!p)return;const h=1.5*s*p.s*0.035,w=0.7*s*p.s*0.035;ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(p.x,p.y,w,w*0.35,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=col;ctx.fillRect(p.x-w*0.45,p.y-h,w*0.9,h*0.75);ctx.fillStyle=isHero?'#c9a227':'#d8c48a';ctx.beginPath();ctx.arc(p.x,p.y-h,w*0.38,0,Math.PI*2);ctx.fill();if(isHero){ctx.strokeStyle='#e8d7a0';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(p.x+w*0.4,p.y-h*0.5);ctx.lineTo(p.x+w*1.3,p.y-h*0.9);ctx.stroke();}}
let last=performance.now();
function tick(now){const dt=Math.min(0.05,(now-last)/1000);last=now;requestAnimationFrame(tick);
if(!hero.dead){hero.atkCd=Math.max(0,hero.atkCd-dt);for(const k of Object.keys(skills))skills[k].cd=Math.max(0,skills[k].cd-dt);let mx=0,mz=0;if(keys.w)mz+=1;if(keys.s)mz-=1;if(keys.a)mx-=1;if(keys.d)mx+=1;const spd=7+hero.agi*0.12;if(mx||mz){const l=Math.hypot(mx,mz)||1;mx/=l;mz/=l;hero.x+=(Math.sin(camYaw)*mz+Math.cos(camYaw)*mx)*spd*dt;hero.z+=(Math.cos(camYaw)*mz-Math.sin(camYaw)*mx)*spd*dt;hero.yaw=camYaw;}hero.x=Math.max(-80,Math.min(80,hero.x));hero.z=Math.max(-80,Math.min(80,hero.z));hero.hp=Math.min(hero.maxHp,hero.hp+dt*(1.1+hero.vit*0.08));hero.mp=Math.min(hero.maxMp,hero.mp+dt*(1.3+hero.int*0.1));for(const en of enemies){if(!en.alive)continue;en.atkCd=Math.max(0,en.atkCd-dt);const dx=hero.x-en.x,dz=hero.z-en.z,d=Math.hypot(dx,dz);if(d<16){if(d>2.2){en.x+=dx/d*en.spd*dt;en.z+=dz/d*en.spd*dt;}else if(en.atkCd<=0){const dmg=en.dmg[0]+Math.floor(Math.random()*(en.dmg[1]-en.dmg[0]+1));hero.hp-=dmg;en.atkCd=1.2;log(en.name+' hit '+dmg,'dmg');if(hero.hp<=0){hero.dead=true;hero.hp=0;document.getElementById('deadModal').classList.add('show');}}}else{en.wander+=dt;en.x+=Math.cos(en.wander)*0.7*dt;en.z+=Math.sin(en.wander*0.7)*0.7*dt;}}}
drawSky();drawGround();const objs=[];for(const t of trees){const p=project(t.x,0,t.z);if(p)objs.push({d:p.depth,k:'t',t});}for(const en of enemies){if(!en.alive)continue;const p=project(en.x,0,en.z);if(p)objs.push({d:p.depth,k:'e',en});}const hp=project(hero.x,0,hero.z);if(hp)objs.push({d:hp.depth,k:'h'});objs.sort((a,b)=>b.d-a.d);for(const o of objs){if(o.k==='t')drawTree(o.t);else if(o.k==='e')drawActor(o.en.x,o.en.z,o.en.col,o.en.s,false);else drawActor(hero.x,hero.z,'#3a4250',1,true);}
document.getElementById('lvl').textContent=hero.lvl;document.getElementById('hpTxt').textContent=Math.floor(hero.hp)+'/'+hero.maxHp;document.getElementById('mpTxt').textContent=Math.floor(hero.mp)+'/'+hero.maxMp;document.getElementById('expTxt').textContent=Math.floor(hero.exp)+'/'+hero.next;document.getElementById('hpFill').style.width=(100*hero.hp/hero.maxHp)+'%';document.getElementById('mpFill').style.width=(100*hero.mp/hero.maxMp)+'%';document.getElementById('expFill').style.width=(100*hero.exp/hero.next)+'%';document.getElementById('sStr').textContent=hero.str;document.getElementById('sVit').textContent=hero.vit;document.getElementById('sAgi').textContent=hero.agi;document.getElementById('sInt').textContent=hero.int;document.getElementById('sLuk').textContent=hero.luk;document.getElementById('ptsLabel').textContent=hero.pts?('+'+hero.pts):'';
}
requestAnimationFrame(tick);
</script>
</body></html>
